        /* DESIGN PRINCIPLES: Times New Roman, EINE Schriftgröße, KEIN Fett, minimaler Abstand. Layout: Full-Width Scroll-Landing Page, Vollbild-Modal rechts. */
        
        /* --- DESIGN VARIABLEN --- */
        :root {
            /* Grid System */
            --grid-margin: 1.25rem; /* 20px */
            --grid-gutter: 0.625rem; /* 10px */
            --grid-columns: 5;
            --row-top-margin: 1.25rem; /* 20px */
            --row-spacing: 0.625rem; /* 10px */
            --row-height: 5.625rem; /* 90px */
            
            /* Einheitlicher Außenabstand für ALLE Ränder und Abstände zwischen Elementen */
            --grid-padding: var(--grid-margin);
            
            /* Standardisierte Zeilenhöhe und Schriftgröße */
            --caption-height: 1.5rem; /* ~24px */
            --main-font-size: 0.9rem;
            --line-height-ratio: 1.05; /* 105% */
            
            /* Höhe des festen Modal-Headers: (3 Zeilen + 2 * --grid-padding)
               Hier wird der Platz für das obere und untere Padding des Headers reserviert. */
            --modal-header-height: calc(3 * var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
        }
        
        body {
            background-color: white;
            color: black;
            font-family: 'Times New Roman', Times, serif;
            font-size: var(--main-font-size);
            line-height: calc(var(--caption-height) * var(--line-height-ratio)); /* 105% */
            width: 100vw;
            /* Scrollbar nur vertikal zulassen */
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }
        
        /* --- 1. Landing Page Sektion --- */
        #nav-section {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            z-index: 10;
            background-color: white;
            /* EINHEITLICHES PADDING FÜR AUSSENRÄNDER (WICHTIG!) */
            padding: var(--grid-padding);
            box-sizing: border-box;
            overflow-y: visible;
            /* Grid System */
            display: grid;
            grid-template-columns: repeat(var(--grid-columns), 1fr);
            gap: var(--grid-gutter);
        }
        
        /* --- TOP INFO BEREICH (Name, Email, Imprint) --- */
        #top-info-area {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: var(--row-top-margin);
            margin-bottom: var(--row-spacing);
        }
        
        /* Name/Email Interaktion */
        #name-link-container {
            cursor: pointer;
            width: max-content;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        /* Whitespace unter dem Namen (grid-aligned) */
        #name-link-container::after {
            content: '';
            display: block;
            height: var(--row-spacing);
            width: 100%;
        }
        
        /* E-Mail Wrapper: Kontrolliert die Höhe */
        #email-address-wrapper {
            height: 0;
            overflow: hidden;
            opacity: 0;
            transition: height 0.3s ease-out, opacity 0.3s ease-out;
            padding-left: 1rem; /* Einzug */
        }
        
        /* JS-gesteuerter Expanded Zustand für E-Mail */
        #email-address-wrapper.is-expanded {
            height: var(--caption-height);
            opacity: 1;
        }
        
        /* --- MAIN GALLERY SECTION (Enthält nun auch das Imprint) --- */
        /* Container für die Vorschaubilder (Galerie der Serien + Imprint) */
        #preview-image-nav {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            /* EINHEITLICHER ABSTAND ZWISCHEN DEN ELEMENTEN */
            gap: var(--row-spacing);
        }
        
        /* Stil der einzelnen Vorschaubilder: Full Width, No Crop */
        .preview-item-wrapper {
            width: 100%;
            height: auto;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        /* Einheitlicher Abstand zwischen Info und Bild/Platzhalter auf der Landing Page */
        .preview-info-block {
            /* EINHEITLICHER ABSTAND ZWISCHEN TEXT INFO UND BILD/ELEMENT (innerhalb der Serie) */
            margin-bottom: calc(var(--caption-height) * var(--line-height-ratio)); /* Eine Zeile Abstand */
        }
        
        /* Exhibition Info Styling - 3 Zeilen Format */
        .exhibition-title {
            font-style: italic;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .exhibition-date {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .exhibition-location {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* Nur für Serien-Titel (Kursiv) */

            cursor: pointer;
            text-align: right;

        .full-screen-modal {

            left: 0;

        .modal-header {

            overflow-y: auto;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 1. GALLERY SECTION */
        #modal-gallery-content {
            /* padding-top: 0; Der Abstand wird durch das padding-bottom des Headers erzeugt. */
            padding-top: 0;
            /* Horizontales Padding zur Ausrichtung an der Kante (WICHTIG: EINHEITLICH) */
            padding-left: var(--grid-padding);
            padding-right: var(--grid-padding);
            padding-bottom: 0;
        }
        
        .image-block {
            padding: 0;
            /* EINHEITLICHER ABSTAND ZWISCHEN den Bildern (unten) */

        .modal-gallery-image {

            height: auto;

            /* Dieser Abstand MUSS 0 sein, da der vertikale Abstand zum Textblock durch modal-text-wrapper hinzugefügt wird. */
            margin-bottom: 0;
        }
        
        /* 2. TEXT SECTION (Für alle Texte) */
        .modal-text-wrapper {
            /* Vertikales Padding: Oben (Abstand zur Galerie), Unten (Abstand zum Footer) */
            /* Horizontales Padding zur Ausrichtung an der Kante (WICHTIG: EINHEITLICH) */

        }
        
        .modal-text-block {

            margin: 0 0 var(--caption-height) 0;
        }
        
        /* Entfernt den Abstand nach dem letzten Absatz im Textblock. */
        .modal-text-block p:last-child {
            margin-bottom: 0;
        }
        
        /* 3. FOOTER SECTION */
        .modal-footer {
            /* Setzt den Abstand unten (zum Bildschirmrand) und oben (zum Textblock) */
            /* Horizontales Padding zur Ausrichtung an der Kante (WICHTIG: EINHEITLICH) */
            padding: var(--grid-padding) var(--grid-padding) var(--grid-padding) var(--grid-padding);
        }
        
        /* --- TYPOGRAFIE & INTERAKTION --- */
        .interactable-text {
            color: black;
            transition: color 0.2s;
            cursor: pointer;
            text-decoration: none !important;
            display: block;
        }

        .interactable-text:hover,

        .exhibition-title:hover,

        .exhibition-location:hover {

            color: black !important;
        }

            color: black !important;
        }

        @media (max-width: 1024px) {

                --grid-padding: 0.75rem; /* 12px */

            #nav-section {

                padding-bottom: var(--grid-padding);

        }
        
        @media (max-width: 768px) {
            :root {
                --grid-columns: 2; /* Noch weniger Spalten auf sehr kleinen Bildschirmen */
            }
        }
        
        @media (max-width: 480px) {
            :root {
                --grid-columns: 1; /* Eine Spalte auf sehr kleinen Bildschirmen */
            }
        }

        // Helper function to format dates: "16 July 2025 – 22 July 2025" -> "July 16, 2025 – July 22, 2025"
        function formatDate(dateString) {
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            
            // Parse formats like "16 July 2025 – 22 July 2025" or "15 May – 15 June 2022"
            const parts = dateString.split(' – ');
            if (parts.length !== 2) return dateString; // Return original if can't parse
            
            function parseDatePart(part) {
                part = part.trim();
                // Match "DD Month YYYY" or "DD Month"
                const match = part.match(/(\d+)\s+(\w+)(?:\s+(\d{4}))?/);
                if (!match) return part;
                
                const day = match[1];
                const monthName = match[2];
                const year = match[3] || '';
                
                const monthIndex = monthNames.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
                if (monthIndex === -1) return part;
                
                const month = monthNames[monthIndex];
                return year ? `${month} ${day}, ${year}` : `${month} ${day}`;
            }
            
            const start = parseDatePart(parts[0]);
            const end = parseDatePart(parts[1]);
            
            // If end doesn't have year, try to get it from start
            if (!end.match(/\d{4}/) && start.match(/\d{4}/)) {
                const yearMatch = start.match(/(\d{4})/);
                if (yearMatch) {
                    return `${start} – ${end}, ${yearMatch[1]}`;
                }
            }
            
            return `${start} – ${end}`;

        // --- ELEMENTS ---
        const nameLinkContainer = document.getElementById('name-link-container');
        const emailAddressWrapper = document.getElementById('email-address-wrapper');
        const previewImageNav = document.getElementById('preview-image-nav');
        
        // GALERIE MODAL Elemente
        const showModal = document.getElementById('show-modal');
        const closeModalButton = document.getElementById('close-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDate = document.getElementById('modal-date');
        const modalLocation = document.getElementById('modal-location');
        const modalGalleryContent = document.getElementById('modal-gallery-content');
        const modalText = document.getElementById('modal-text');
        const modalContentScroll = document.getElementById('modal-content-scroll');
        
        // Imprint Elements
        const imprintLinkTop = document.getElementById('imprint-link-top');
        const imprintContentInline = document.getElementById('imprint-content-inline');
        
        // Funktion zum Schließen aller Modals
        function closeAllModals() {
            showModal.classList.remove('is-active');
        }
        
        // --- FUNCTIONS ---
        // Füllt die Landing Page mit den Serien-Vorschaubildern und dem Imprint-Link
        function renderPreviewImages() {
            let html = '';
            
            seriesOrder.forEach(seriesKey => {
                const data = seriesData[seriesKey];
                if (!data) return;
                
                // Für reguläre Serien (mit Bild) - 3 Zeilen Format
                const firstImage = data.images[0];
                html += `
                    <div class="preview-item-wrapper gallery-item" data-series="${seriesKey}">
                        <!-- Titel, Datum und Ort über dem Bild -->
                        <div class="preview-info-block">
                            <!-- Zeile 1: Titel (kursiv) -->
                            <div class="exhibition-title">${data.title}</div>
                            <!-- Zeile 2: Datum -->
                            <div class="exhibition-date">${data.date}</div>
                            <!-- Zeile 3: Ort -->
                            <div class="exhibition-location">${data.location}</div>
                        </div>
                        <img src="${firstImage.src}" alt="${data.title} Preview" class="preview-image" onerror="this.onerror=null;this.src='https://placehold.co/1500x800/f3f4f6/000000?text=Image+Load+Error';" title="${data.title}">
                    </div>
                `;
            });
            
            previewImageNav.innerHTML = html;
            
            // Event Listener für alle Galerie-Einträge hinzufügen
            document.querySelectorAll('.preview-item-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', (event) => {
                    const seriesKey = wrapper.getAttribute('data-series');
                    openShowModal(seriesKey);
                });
            });
        }
        
        // Öffnet das Modal für Galerie-Details
        function openShowModal(seriesKey) {
            closeAllModals(); // Sicherstellen, dass andere Modals geschlossen sind
            
            const data = seriesData[seriesKey];
            if (!data) return;
            
            // 1. Header füllen - 3 Zeilen Format
            modalTitle.innerHTML = data.title; // Wird durch CSS kursiv gemacht
            modalDate.innerHTML = data.date;
            modalLocation.innerHTML = data.location;
            
            // 2. Scrollbaren Inhalt füllen
            // Text füllen (Absätze aus Zeilenumbrüchen erstellen)
            modalText.innerHTML = data.description
                .split('\n')
                .filter(p => p.trim() !== '') // Leere Zeilen entfernen
                .map(p => `<p>${p.trim()}</p>`)
                .join('');
            
            // Galerie füllen
            let galleryHtml = '';
            data.images.forEach(imgData => {
                galleryHtml += `
                    <div class="image-block">
                        <img src="${imgData.src}" alt="${data.title}" class="modal-gallery-image" onerror="this.onerror=null;this.src='https://placehold.co/900x600/f3f4f6/000000?text=Image+Load+Error';">
                    </div>
                `;
            });
            modalGalleryContent.innerHTML = galleryHtml;
            
            // 3. Modal anzeigen und nach oben scrollen
            showModal.classList.add('is-active');
            modalContentScroll.scrollTop = 0;
        }
        
        // Toggle Imprint Content (Inline auf der Landing Page)
        function toggleImprint() {
            if (imprintContentInline) {
                imprintContentInline.classList.toggle('is-expanded');
            }
        }
        
        // --- EVENT LISTENERS & INITIALIZATION ---
        // 1. E-Mail Toggle
        nameLinkContainer.addEventListener('click', (event) => {
            event.preventDefault();
            emailAddressWrapper.classList.toggle('is-expanded');
        });
        
        // 2. Imprint Toggle (oben rechts)
        if (imprintLinkTop) {
            imprintLinkTop.addEventListener('click', (event) => {
                event.preventDefault();
                toggleImprint();
            });
        }
        
        // 3. Close Button für das Galerie-Modal
        closeModalButton.addEventListener('click', (event) => {
            event.preventDefault();
            closeAllModals();
        });
        
        // Initialisierung
        window.addEventListener('load', () => {
            renderPreviewImages();
            // Imprint Content Element füllen
            const imprintData = seriesData.imprint;
            if (imprintData && imprintContentInline) {
                const cleanText = imprintData.description.replace(/\s+/g, ' ').trim();
                imprintContentInline.innerHTML = `<p>${cleanText}</p>`;
            }
        });
    </script>
</body>
</html>

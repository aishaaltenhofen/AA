    <!-- Tailwind CSS wird für die Struktur verwendet --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /*
        DESIGN PRINCIPLES: Times New Roman, EINE Schriftgröße, KEIN Fett, minimaler Abstand.
        Layout: Full-Width Scroll-Landing Page, Vollbild-Modal rechts.
        */
        /* --- DESIGN VARIABLEN (ANGEPASST AN RASSTERVORGABEN) --- */
        :root {
            /* UNIVERSAL SPACING: 20px outer margin, 10px gutter */
            --outer-margin: 1.25rem; /* 20px */
            --grid-gutter: 0.625rem; /* 10px */

            /* Grid: variable columns (desktop default 5) */
            --columns: 5;

            /* Row sizing */
            --row-height: 90px; /* Höhe einer Grid-Row */

            /* Standardisierte Zeilenhöhe und Schriftgröße */
            --main-font-size: 0.9rem;
            /* Zeilenhöhe immer 105% */
            --line-height-factor: 1.05;
            --caption-height: calc(var(--main-font-size) * var(--line-height-factor));

            /* Höhe des festen Modal-Headers: (2 Zeilen + 2 * --outer-margin) */
            --modal-header-height: calc(2 * var(--caption-height) + 2 * var(--outer-margin));
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: white;
            color: black;
            font-family: 'Times New Roman', Times, serif;
            font-size: var(--main-font-size);
            line-height: var(--line-height-factor); /* 105% */
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        /* --- 0. Layout-Grid für die gesamte Seite --- */
        /* nav-section benutzt ein Raster mit variabler Spaltenanzahl (responsive) */
        #nav-section {
            display: grid;
            grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
            grid-auto-rows: var(--row-height);
            gap: var(--grid-gutter);

            width: 100vw;
            min-height: 100vh;
            z-index: 10;
            background-color: white;
            padding: var(--outer-margin);
            box-sizing: border-box;
            align-items: start; /* Startet die Items oben in ihren Rows */
        }

        /* --- TOP INFO BEREICH (Name, Email, Imprint) --- */
        /* Dieser Bereich nimmt eine volle Breite (alle Spalten) */
        #top-header-area {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between; /* Name links, Imprint so weit rechts wie möglich */
            height: auto;
            margin: 0;
            padding: 0;
        }

        /* Name/Email Container (links) */
        #name-link-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Name als Text, aber semantisch beibehalten (kein h1-Änderung angefragt) */
        #name-link {
            margin: 0 0 calc(var(--grid-gutter)); 0; /* kleiner Abstand unter dem Namen (Raster-gebunden) */
            line-height: var(--line-height-factor);
        }

        /* E-Mail Wrapper: Kontrolliert die Höhe */
        #email-address-wrapper {
            height: 0;
            overflow: hidden;
            opacity: 0;
            transition: height 0.3s ease-out, opacity 0.3s ease-out;
            padding-left: 1rem; /* Einzug */
        }

        #email-address-wrapper.is-expanded {
            height: var(--caption-height);
            opacity: 1;
        }

        /* Imprint am rechten Rand so weit raus wie möglich (gleiches Grid-Edge) */
        #imprint-title-area {
            margin-left: auto; /* drückt es so weit rechts wie möglich */
            line-height: var(--line-height-factor);
        }

        /* Inline Imprint-Container (versteckt/aufklappbar) */
        #imprint-content-inline {
            grid-column: 1 / -1;
            width: 100%;
            padding-left: 1rem;
            height: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.8s ease-in-out, opacity 0.4s ease-in-out;
            box-sizing: border-box;
            word-break: break-word;
            white-space: normal;
        }

        #imprint-content-inline.is-expanded {
            margin-bottom: var(--grid-gutter);
            max-height: 20rem;
            height: auto;
            opacity: 1;
        }

        #imprint-content-inline p { margin: 0; line-height: var(--line-height-factor); }

        /* --- PREVIEW GALLERY: Grid mit variabler Spaltenanzahl --- */
        #preview-image-nav {
            grid-column: 1 / -1; /* nimmt die volle Breite */
            display: grid;
            grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
            gap: var(--grid-gutter);
            align-items: start;
        }

        /* Vorschau-Items (Bild + dreizeilige Info) */
        .preview-item-wrapper {
            width: 100%;
            height: auto;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
        }

        .preview-info-block {
            /* Abstand zwischen Info und Bild: genau eine Zeile (caption-height) */
            margin-bottom: var(--caption-height);
            line-height: var(--line-height-factor);
            display: block;
        }

        /* Dreizeiliges Format: Titel kursiv, Daten, Ort */
        .preview-info-block .is-series-title { font-style: italic; }

        /* Die ausstellungsinfos sind klickbar (werden grau bei hover) */
        .preview-info-block .interactable-text { text-decoration: none !important; display: block; color: black; }
        .preview-info-block .interactable-text:hover { color: gray !important; }

        .preview-image {
            width: 100%;
            height: auto;
            object-fit: contain; /* Bild wird nie beschnitten */
            opacity: 1;
            transition: opacity 0.2s;
            display: block;
        }

        /* Generelle klickbare Texte (Hover wird grau) */
        .interactable-text {
            color: black;
            transition: color 0.2s;
            cursor: pointer;
            text-decoration: none !important;
            display: block;
        }
        .interactable-text:hover { color: gray !important; }

        /* --- MODAL --- */
        .full-screen-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white; z-index: 20; display: none; overflow: hidden;
        }
        .full-screen-modal.is-active { display: block; }

        .modal-header {
            position: fixed; top: 0; left: 0; width: 100%;
            height: var(--modal-header-height);
            box-sizing: border-box; background-color: white; z-index: 30;
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: var(--outer-margin);
        }

        .modal-info-left { line-height: var(--line-height-factor); display: flex; flex-direction: column; }
        .modal-title-series { font-style: italic; }

        .close-modal-button { cursor: pointer; line-height: var(--line-height-factor); flex-shrink: 0; }

        .modal-content-scroll { margin-top: var(--modal-header-height); height: calc(100vh - var(--modal-header-height)); overflow-y: auto; padding: 0; box-sizing: border-box; }

        #modal-gallery-content { padding-left: var(--outer-margin); padding-right: var(--outer-margin); }
        .image-block { padding: 0; margin-bottom: var(--grid-gutter); }
        .modal-gallery-image { width: 100%; height: auto; object-fit: contain; display: block; }
        #modal-gallery-content .image-block:last-child { margin-bottom: 0; }

        .modal-text-wrapper { padding: var(--grid-gutter) var(--outer-margin) 0 var(--outer-margin); }
        .modal-text-block { max-width: 700px; }

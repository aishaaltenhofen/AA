<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aisha Altenhofen Portfolio | Minimal Design V64</title>
    
    <!-- Tailwind CSS wird für die Struktur verwendet -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* DESIGN PRINCIPLES: Times New Roman, EINE Schriftgröße, KEIN Fett, minimaler Abstand. Layout: Full-Width Scroll-Landing Page, Vollbild-Modal rechts. */
        
        /* --- DESIGN VARIABLEN --- */
        :root {
            /* Grid System */
            --grid-margin: 1.25rem; /* 20px */
            --grid-gutter: 0.625rem; /* 10px */
            --grid-columns: 5;
            --row-top-margin: 1.25rem; /* 20px */
            --row-spacing: 0.625rem; /* 10px */
            --row-height: 5.625rem; /* 90px */
            
            /* Einheitlicher Außenabstand für ALLE Ränder und Abstände zwischen Elementen */
            --grid-padding: var(--grid-margin);
            
            /* Standardisierte Zeilenhöhe und Schriftgröße */
            --caption-height: 1.5rem; /* ~24px */
            --main-font-size: 0.9rem;
            --line-height-ratio: 0.525; /* 52.5% - halbiert */
            
            /* Höhe des festen Modal-Headers: (3 Zeilen + 2 * --grid-padding)
               Hier wird der Platz für das obere und untere Padding des Headers reserviert. */
            --modal-header-height: calc(3 * var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
        }
        
        body {
            background-color: white;
            color: black;
            font-family: 'Times New Roman', Times, serif;
            font-size: var(--main-font-size);
            line-height: calc(var(--caption-height) * var(--line-height-ratio)); /* 105% */
            width: 100vw;
            /* Scrollbar nur vertikal zulassen */
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }
        
        /* --- 1. Landing Page Sektion --- */
        #nav-section {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            z-index: 10;
            background-color: white;
            /* EINHEITLICHES PADDING FÜR AUSSENRÄNDER (WICHTIG!) */
            padding: var(--grid-padding);
            box-sizing: border-box;
            overflow-y: visible;
            /* Grid System */
            display: grid;
            grid-template-columns: repeat(var(--grid-columns), 1fr);
            gap: var(--grid-gutter);
        }
        
        /* --- FIXED HEADER (Aisha Altenhofen - immer sichtbar) --- */
        #fixed-name-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
            background-color: white;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--grid-padding);
            box-sizing: border-box;
        }
        
        /* Name/Text Interaktion (fixiert) */
        #name-link-container {
            cursor: pointer;
            width: max-content;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: calc(2 * var(--grid-padding)); /* Einrücken */
            margin-top: calc(-1 * var(--caption-height) * var(--line-height-ratio)); /* Eine Zeile höher */
        }
        
        /* Expandable Text Wrapper unter dem Namen (immer verfügbar) */
        #expandable-text-wrapper {
            position: fixed;
            top: calc(var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
            left: calc(2 * var(--grid-padding)); /* Einrücken */
            width: auto;
            max-width: 50vw;
            padding-left: 0;
            /* Startzustand: Versteckt */
            height: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.8s ease-in-out, opacity 0.4s ease-in-out;
            box-sizing: border-box;
            word-break: break-word;
            white-space: normal;
            background-color: white;
            z-index: 99;
        }
        
        /* JS-gesteuerter Expanded Zustand für Text */
        #expandable-text-wrapper.is-expanded {
            max-height: 30rem;
            height: auto;
            opacity: 1;
        }
        
        /* Email Address (rechts oben, fixiert) */
        #email-address-top {
            text-align: right;
            align-self: center;
            padding-right: var(--grid-padding);
        }
        
        /* Spacer für fixierten Header */
        #header-spacer {
            height: calc(var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
            width: 100%;
        }
        
        /* --- TOP INFO BEREICH (nur für Spacer) --- */
        #top-info-area {
            grid-column: 1 / -1;
            height: calc(var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
        }
        
        /* --- MAIN GALLERY SECTION (Enthält nun auch das Imprint) --- */
        /* Container für die Vorschaubilder (Galerie der Serien + Imprint) */
        #preview-image-nav {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            /* EINHEITLICHER ABSTAND ZWISCHEN DEN ELEMENTEN */
            gap: var(--row-spacing);
        }
        
        /* Stil der einzelnen Vorschaubilder: Full Width, No Crop */
        .preview-item-wrapper {
            width: 100%;
            height: auto;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        /* Preview Item: Bild und Info nebeneinander */
        .preview-item-wrapper {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: calc(2 * var(--grid-padding)); /* Abstand Bild-Info = doppelter linker Rand */
            margin-bottom: calc(2 * var(--grid-padding)); /* Abstand zwischen Bildern = doppelter linker Rand */
        }
        
        .preview-image-container {
            width: 50%;
            max-width: 50vw;
            flex-shrink: 0;
        }
        
        .preview-info-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
        }
        
        /* Exhibition Info Styling - 3 Zeilen Format */
        .exhibition-title {
            font-style: italic;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .exhibition-date {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .exhibition-location {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* Nur für Serien-Titel (Kursiv) */
        .preview-info-block .is-series-title {
            font-style: italic;
        }
        
        .preview-image {
            width: 100%;
            height: auto;
            object-fit: contain;
            opacity: 1;
            transition: opacity 0.2s;
            display: block;
        }
        
        /* Responsive: Wenn Bild nicht mehr passt, wird es kleiner */
        @media (max-width: 1024px) {
            .preview-item-wrapper {
                flex-direction: column;
            }
            .preview-image-container {
                width: 100%;
                max-width: 100%;
            }
        }
        
        /* --- IMPRINT SPEZIFISCHES CSS --- */
        /* Imprint am Ende der Startseite, links ausgerichtet */
        #imprint-section-bottom {
            grid-column: 1 / -1;
            margin-top: var(--row-spacing);
            width: max-content;
            padding-left: calc(2 * var(--grid-padding)); /* Einrücken */
            margin-top: calc(var(--row-spacing) - 1 * var(--caption-height) * var(--line-height-ratio)); /* Eine Zeile höher */
        }
        
        #imprint-link-bottom {
            cursor: pointer;
            width: max-content;
        }
        
        /* Aufklappbarer Imprint Text Wrapper */
        #imprint-content-inline {
            width: 100%;
            max-width: 50vw;
            padding-left: 0;
            /* Startzustand: Versteckt */
            height: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.8s ease-in-out, opacity 0.4s ease-in-out;
            box-sizing: border-box;
            word-break: break-word;
            white-space: normal;
            margin-top: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* JS-gesteuerter Expanded Zustand für Imprint Text */
        #imprint-content-inline.is-expanded {
            max-height: 20rem;
            height: auto;
            opacity: 1;
        }
        
        /* Absätze innerhalb des Imprint-Textes und expandable text */
        #imprint-content-inline p,
        #expandable-text-content p {
            margin: 0;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* --- 2. MODAL-VIEWER (Vollbild-Overlay) --- */
        /* Basis-Modal-Klasse für alle Overlays (NUR Galerie) */
        .full-screen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: white;
            z-index: 20;
            display: none;
            overflow: hidden;
        }
        
        .full-screen-modal.is-active {
            display: block;
        }
        
        /* Modal Header: Feste Position oben - Aisha Altenhofen fixiert */
        .modal-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
            box-sizing: border-box;
            background-color: white;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--grid-padding);
        }
        
        /* Modal Content Area: Bilder und Info auf derselben Zeile wie Close */
        .modal-content-area {
            position: fixed;
            top: calc(var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
            left: 0;
            width: 100%;
            height: calc(100vh - var(--caption-height) * var(--line-height-ratio) - 2 * var(--grid-padding));
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Gallery Section in Modal */
        .modal-gallery-section {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding-left: calc(2 * var(--grid-padding)); /* Doppelter linker Rand */
            padding-right: calc(2 * var(--grid-padding)); /* Abstand Bild-Info */
            padding-top: 0;
            padding-bottom: var(--grid-padding);
        }
        
        /* Exhibition Info neben Bildern in Modal */
        .modal-exhibition-info-side {
            width: auto;
            min-width: 300px;
            padding: 0 var(--grid-padding);
            padding-top: 0;
            padding-left: calc(2 * var(--grid-padding)); /* Abstand Bild-Info = doppelter linker Rand */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: sticky;
            top: 0;
            align-self: flex-start;
        }
        
        /* Container für Titel und Details (Links) */
        .modal-info-left {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        
        /* Modal Exhibition Info - 3 Zeilen Format */
        .modal-exhibition-title {
            font-style: italic;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .modal-exhibition-date {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .modal-exhibition-location {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* TITEL (Serien) IMMER KURSIV */
        .modal-title-series {
            font-style: italic;
        }
        
        .close-modal-button {
            cursor: pointer;
            line-height: var(--caption-height);
            flex-shrink: 0;
        }
        
        /* Scrollbarer Modal Content - entfernt, da wir jetzt modal-content-area verwenden */
        .modal-content-scroll {
            display: none;
        }
        
        /* 1. GALLERY SECTION */
        #modal-gallery-content {
            padding: 0;
        }
        
        .image-block {
            padding: 0;
            margin-bottom: calc(2 * var(--grid-padding)); /* Abstand zwischen Bildern = doppelter linker Rand */
            width: 50%;
            max-width: 50vw;
            display: flex;
            flex-direction: column;
        }
        
        .image-block:last-child {
            margin-bottom: 0;
        }
        
        .modal-gallery-image {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }
        
        /* Image Caption Styling */
        .image-caption {
            margin-top: var(--grid-padding);
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .image-caption-title {
            font-style: italic;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .image-caption-material,
        .image-caption-dimensions {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* Abstand nach Caption: 2 leere Zeilen */
        .image-caption-wrapper {
            margin-bottom: calc(2 * var(--caption-height) * var(--line-height-ratio));
        }
        
        /* Responsive: Wenn Bild nicht mehr passt, wird es kleiner */
        @media (max-width: 1024px) {
            .image-block {
                width: 100%;
                max-width: 100%;
            }
        }
        
        /* Entfernt den Abstand NACH dem letzten Bild der Galerie, wenn der Textblock direkt folgt */
        #modal-gallery-content .image-block:last-child .image-caption-wrapper,
        #modal-gallery-content .image-block:last-child > div:last-child {
            margin-bottom: 0;
        }
        
        /* 2. TEXT SECTION (Für alle Texte) - nach Bildern */
        .modal-text-wrapper {
            padding: var(--grid-padding) calc(2 * var(--grid-padding)) 0 calc(2 * var(--grid-padding));
        }
        
        .modal-text-block {
            max-width: none; /* Text läuft so breit wie Platz ist */
            width: 100%;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .modal-text-block p {
            /* Normale Zeilenhöhe zwischen Absätzen */
            margin: 0 0 calc(var(--caption-height) * var(--line-height-ratio)) 0;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* Entfernt den Abstand nach dem letzten Absatz im Textblock. */
        .modal-text-block p:last-child {
            margin-bottom: 0;
        }
        
        /* Exhibition Documentation */
        .exhibition-documentation {
            margin-top: calc(var(--caption-height) * var(--line-height-ratio));
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* Next Exhibition Link */
        .next-exhibition-link {
            margin-top: calc(2 * var(--grid-padding));
            padding: var(--grid-padding) calc(2 * var(--grid-padding));
            cursor: pointer;
        }
        
        .next-exhibition-link:hover {
            color: #808080;
        }
        
        .next-exhibition-title {
            font-style: italic;
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        .next-exhibition-date,
        .next-exhibition-location {
            line-height: calc(var(--caption-height) * var(--line-height-ratio));
        }
        
        /* 3. FOOTER SECTION */
        .modal-footer {
            /* Setzt den Abstand unten (zum Bildschirmrand) und oben (zum Textblock) */
            /* Horizontales Padding zur Ausrichtung an der Kante (WICHTIG: EINHEITLICH) */
            padding: var(--grid-padding) var(--grid-padding) var(--grid-padding) var(--grid-padding);
        }
        
        /* --- TYPOGRAFIE & INTERAKTION --- */
        .interactable-text {
            color: black;
            transition: color 0.2s;
            cursor: pointer;
            text-decoration: none !important;
            display: block;
        }
        
        /* GRAUER HOVER FÜR ALLE KLICKBAREN TEXTE */
        .interactable-text:hover,
        .preview-info-block:hover,
        .exhibition-title:hover,
        .exhibition-date:hover,
        .exhibition-location:hover {
            color: #808080 !important; /* Grau */
        }
        
        /* KEIN HOVER FÜR TEXTE IN MODAL NACH BILDERN */
        .modal-text-block p,
        .modal-text-block {
            color: black !important;
        }
        
        .modal-text-block p:hover {
            color: black !important;
        }
        
        /* --- MOBILE ANPASSUNGEN --- */
        @media (max-width: 1024px) {
            :root {
                /* Einheitliches, reduziertes Mobile Padding */
                --grid-padding: 0.75rem; /* 12px */
                --grid-margin: 0.75rem; /* 12px */
                --grid-gutter: 0.5rem; /* 8px */
                --grid-columns: 3; /* Weniger Spalten auf Mobile */
                /* Die Berechnung des Headers muss nur angepasst werden */
                --modal-header-height: calc(3 * var(--caption-height) * var(--line-height-ratio) + 2 * var(--grid-padding));
            }
            
            #nav-section {
                width: 100%;
                padding-bottom: var(--grid-padding);
            }
        }
        
        @media (max-width: 768px) {
            :root {
                --grid-columns: 2; /* Noch weniger Spalten auf sehr kleinen Bildschirmen */
            }
        }
        
        @media (max-width: 480px) {
            :root {
                --grid-columns: 1; /* Eine Spalte auf sehr kleinen Bildschirmen */
            }
        }
    </style>
</head>

    <script>
        // --- DATA SETUP ---
        const GITHUB_BASE_URL = "https://raw.githubusercontent.com/aishaaltenhofen/AA/main/images/";
        
        // Helper function to format dates: "16 July 2025 – 22 July 2025" -> "July 16, 2025 – July 22, 2025"
        function formatDate(dateString) {
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            
            // Parse formats like "16 July 2025 – 22 July 2025" or "15 May – 15 June 2022"
            const parts = dateString.split(' – ');
            if (parts.length !== 2) return dateString; // Return original if can't parse
            
            function parseDatePart(part) {
                part = part.trim();
                // Match "DD Month YYYY" or "DD Month"
                const match = part.match(/(\d+)\s+(\w+)(?:\s+(\d{4}))?/);
                if (!match) return part;
                
                const day = match[1];
                const monthName = match[2];
                const year = match[3] || '';
                
                const monthIndex = monthNames.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
                if (monthIndex === -1) return part;
                
                const month = monthNames[monthIndex];
                return year ? `${month} ${day}, ${year}` : `${month} ${day}`;
            }
            
            const start = parseDatePart(parts[0]);
            const end = parseDatePart(parts[1]);
            
            // If end doesn't have year, try to get it from start
            if (!end.match(/\d{4}/) && start.match(/\d{4}/)) {
                const yearMatch = start.match(/(\d{4})/);
                if (yearMatch) {
                    return `${start} – ${end}, ${yearMatch[1]}`;
                }
            }
            
            return `${start} – ${end}`;
        }
        
        const seriesData = {
            carrier: {
                title: "The Carrier",
                date: "July 16, 2025 – July 22, 2025",
                location: "University of the Arts, Berlin, DE",
                description: `The Carrier is a series of eleven photographs taken at Villa Necchi Campiglio in Milan. Ten were taken through the curved glass facade of the villa as I moved between interior and exterior spaces. Another image was taken through a serving cart in the house. The villa was built between 1932 and 1935 for the Necchi-Campiglio industrial family. During the fascist regime, it was confiscated and used as one of Mussolini's local headquarters. After the war, the family returned to the house.`,
                images: [
                    { id: "img-carrier-01", src: GITHUB_BASE_URL + "Graduation 2025 - 01.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-02", src: GITHUB_BASE_URL + "Graduation 2025 - 02.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-03", src: GITHUB_BASE_URL + "Graduation 2025 - 03.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-04", src: GITHUB_BASE_URL + "Graduation 2025 - 04.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-05", src: GITHUB_BASE_URL + "Graduation 2025 - 05.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-06", src: GITHUB_BASE_URL + "Graduation 2025 - 06.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-07", src: GITHUB_BASE_URL + "Graduation 2025 - 07.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-08", src: GITHUB_BASE_URL + "Graduation 2025 - 08.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-09", src: GITHUB_BASE_URL + "2025- Repro-01.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-10", src: GITHUB_BASE_URL + "2025-Repro-02.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-carrier-11", src: GITHUB_BASE_URL + "2025-Repro-03.jpg", title: "", material: "", dimensions: "" },
                ]
            },
            aabb: {
                title: "AABB",
                date: "December 18, 2024 – March 28, 2025",
                location: "Dorothea Konwiarz Stiftung, Duo Exhibition with Bonnie Barth, Berlin, DE",
                description: `This is a placeholder for the AABB series text. Please replace this with your actual exhibition details or artist statement.`,
                images: [
                    { id: "img-aabb-01", src: "https://placehold.co/1500x800/a3a3a3/000000?text=AABB+Image+01", title: "", material: "", dimensions: "" },
                    { id: "img-aabb-02", src: "https://placehold.co/800x1200/949494/000000?text=AABB+Image+02", title: "", material: "", dimensions: "" }
                ]
            },
            exposure: {
                title: "First Exposure",
                date: "July 20, 2024 – August 25, 2024",
                location: "Austin Space, Munich, DE",
                description: `The exhibition took place at Austin Space. Press: Quirin Brunnmeier: Contact and Engagement, Aisha Altenhofen at Austin Space (Link: https://www.gallerytalk.net/aisha-altenhofen-austin-space/)`,
                images: [
                    { id: "img-exp-01", src: GITHUB_BASE_URL + "2024-FE-01-install.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-02", src: GITHUB_BASE_URL + "2024-FE-02-install.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-03", src: GITHUB_BASE_URL + "2024-FE-03-install.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-04", src: GITHUB_BASE_URL + "2024-FE-04-install.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-05", src: GITHUB_BASE_URL + "2024-FE-05-install.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-06", src: GITHUB_BASE_URL + "2024-FE-07-repro.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-07", src: GITHUB_BASE_URL + "2024-FE-08-repro.jpg", title: "", material: "", dimensions: "" },
                    { id: "img-exp-08", src: GITHUB_BASE_URL + "2024-FE-09-repro.jpg", title: "", material: "", dimensions: "" },
                ]
            },
            aftertext: {
                title: "Aftertext",
                date: "January 1, 2023 – January 31, 2023",
                location: "Placeholder Gallery, City Center, Munich, DE",
                description: `This is a placeholder for the Aftertext series text. Please replace this with your actual exhibition details or artist statement.`,
                images: [
                    { id: "img-at-01", src: "https://placehold.co/1500x800/c7d2fe/1e3a8a?text=Aftertext+View+1", title: "", material: "", dimensions: "" },
                    { id: "img-at-02", src: "https://placehold.co/900x1200/93c5fd/1e3a8a?text=Aftertext+View+2", title: "", material: "", dimensions: "" },
                    { id: "img-at-03", src: "https://placehold.co/900x600/60a5fa/1e3a8a?text=Aftertext+Repro+A", title: "", material: "", dimensions: "" },
                ]
            },
            conditionedAir: {
                title: "Conditioned Air",
                date: "May 15, 2022 – June 15, 2022",
                location: "The Studio Gallery, Berlin, DE",
                description: `This is a placeholder for the Conditioned Air series text. Please replace this with your actual exhibition details or artist statement.`,
                images: [
                    { id: "img-ca-01", src: "https://placehold.co/1500x800/fecaca/991b1b?text=Conditioned+Air+View+A", title: "", material: "", dimensions: "" },
                    { id: "img-ca-02", src: "https://placehold.co/900x600/fca5a5/991b1b?text=Conditioned+Air+View+B", title: "", material: "", dimensions: "" },
                    { id: "img-ca-03", src: "https://placehold.co/900x1200/f87171/991b1b?text=Duet+X", title: "", material: "", dimensions: "" },
                ]
            },
            imprint: {
                title: "Imprint",
                date: "",
                location: "",
                description: `This website is independently operated by Aisha Altenhofen. For contact, please use the email address aishaaltenhofen@gmail.com. The responsible party is Aisha Altenhofen, located at Sonnenallee 159, Berlin, 12059. All photographic works and textual content presented here are protected by copyright. Unauthorized use of this material is prohibited. The rights for all images and texts remain with the artist, unless explicitly noted otherwise.`,
                images: [] // Keine Bilder für Imprint
            }
        };
        
        // Imprint ist nicht mehr in der Galerie, nur oben
        const seriesOrder = ['carrier', 'aabb', 'exposure', 'aftertext', 'conditionedAir'];
        
        // --- GLOBAL VARIABLES ---
        let nameLinkContainer, expandableTextWrapper, previewImageNav;
        let showModal, closeModalButton, modalTitle, modalDate, modalLocation;
        let modalGalleryContent, modalText;
        let imprintLinkBottom, imprintContentInline;
        let currentSeriesIndex = 0;
        
        // Configurable expandable text under name (can be edited here)
        const expandableTextContent = `Insert your text here that will be expandable under your name.`;
        
        // Funktion zum Schließen aller Modals
        function closeAllModals() {
            if (showModal) {
                showModal.classList.remove('is-active');
            }
        }
        
        // --- FUNCTIONS ---
        // Füllt die Landing Page mit den Serien-Vorschaubildern und dem Imprint-Link
        function renderPreviewImages() {
            if (!previewImageNav) return;
            
            let html = '';
            
            seriesOrder.forEach(seriesKey => {
                const data = seriesData[seriesKey];
                if (!data || !data.images || data.images.length === 0) return;
                
                // Für reguläre Serien (mit Bild) - Bild und Info nebeneinander
                const firstImage = data.images[0];
                html += `
                    <div class="preview-item-wrapper gallery-item" data-series="${seriesKey}">
                        <!-- Bild links -->
                        <div class="preview-image-container">
                            <img src="${firstImage.src}" alt="${data.title} Preview" class="preview-image" onerror="this.onerror=null;this.src='https://placehold.co/1500x800/f3f4f6/000000?text=Image+Load+Error';" title="${data.title}">
                        </div>
                        <!-- Info rechts -->
                        <div class="preview-info-block">
                            <!-- Zeile 1: Titel (kursiv) -->
                            <div class="exhibition-title">${data.title}</div>
                            <!-- Zeile 2: Datum -->
                            <div class="exhibition-date">${data.date}</div>
                            <!-- Zeile 3: Ort -->
                            <div class="exhibition-location">${data.location}</div>
                        </div>
                    </div>
                `;
            });
            
            previewImageNav.innerHTML = html;
            
            // Event Listener für alle Galerie-Einträge hinzufügen
            document.querySelectorAll('.preview-item-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', (event) => {
                    const seriesKey = wrapper.getAttribute('data-series');
                    if (seriesKey) {
                        openShowModal(seriesKey);
                    }
                });
            });
        }
        
        // Öffnet das Modal für Galerie-Details
        function openShowModal(seriesKey) {
            if (!showModal || !modalTitle || !modalDate || !modalLocation || !modalText || !modalGalleryContent) return;
            
            closeAllModals(); // Sicherstellen, dass andere Modals geschlossen sind
            
            const data = seriesData[seriesKey];
            if (!data) return;
            
            // Update current series index
            currentSeriesIndex = seriesOrder.indexOf(seriesKey);
            
            // 1. Exhibition Info rechts füllen - 3 Zeilen Format
            modalTitle.innerHTML = data.title || ''; // Wird durch CSS kursiv gemacht
            modalDate.innerHTML = data.date || '';
            modalLocation.innerHTML = data.location || '';
            
            // 2. Galerie füllen mit Captions
            let galleryHtml = '';
            if (data.images && data.images.length > 0) {
                data.images.forEach((imgData, index) => {
                    const hasCaption = imgData.title || imgData.material || imgData.dimensions;
                    galleryHtml += `
                        <div class="image-block">
                            <img src="${imgData.src}" alt="${data.title || 'Image'}" class="modal-gallery-image" onerror="this.onerror=null;this.src='https://placehold.co/900x600/f3f4f6/000000?text=Image+Load+Error';">
                            ${hasCaption ? `
                                <div class="image-caption-wrapper">
                                    <div class="image-caption">
                                        ${imgData.title ? `<div class="image-caption-title">${imgData.title}</div>` : ''}
                                        ${imgData.material ? `<div class="image-caption-material">${imgData.material}</div>` : ''}
                                        ${imgData.dimensions ? `<div class="image-caption-dimensions">${imgData.dimensions}</div>` : ''}
                                    </div>
                                </div>
                            ` : `<div class="image-caption-wrapper" style="margin-top: var(--grid-padding);"></div>`}
                        </div>
                    `;
                });
            }
            modalGalleryContent.innerHTML = galleryHtml;
            
            // Text füllen (Absätze aus Zeilenumbrüchen erstellen) + Exhibition Documentation
            if (data.description) {
                const descriptionHtml = data.description
                    .split('\n')
                    .filter(p => p.trim() !== '') // Leere Zeilen entfernen
                    .map(p => `<p>${p.trim()}</p>`)
                    .join('');
                
                modalText.innerHTML = descriptionHtml + `<div class="exhibition-documentation">Exhibition Documentation: Julian Blum</div>`;
            } else {
                modalText.innerHTML = `<div class="exhibition-documentation">Exhibition Documentation: Julian Blum</div>`;
            }
            
            // 3. Next Exhibition Link am Ende
            const nextIndex = (currentSeriesIndex + 1) % seriesOrder.length;
            const nextSeriesKey = seriesOrder[nextIndex];
            const nextData = seriesData[nextSeriesKey];
            const nextExhibitionWrapper = document.getElementById('next-exhibition-wrapper');
            if (nextExhibitionWrapper && nextData) {
                nextExhibitionWrapper.innerHTML = `
                    <div class="next-exhibition-link" data-next-series="${nextSeriesKey}">
                        <div>Next:</div>
                        <div style="height: calc(var(--caption-height) * var(--line-height-ratio));"></div>
                        <div class="next-exhibition-title">${nextData.title}</div>
                        <div class="next-exhibition-date">${nextData.date}</div>
                        <div class="next-exhibition-location">${nextData.location}</div>
                    </div>
                `;
                
                // Event Listener für Next Link
                const nextLink = nextExhibitionWrapper.querySelector('.next-exhibition-link');
                if (nextLink) {
                    nextLink.addEventListener('click', () => {
                        openShowModal(nextSeriesKey);
                    });
                }
            }
            
            // 4. Modal anzeigen
            showModal.classList.add('is-active');
            
            // Scroll to top
            const gallerySection = document.querySelector('.modal-gallery-section');
            if (gallerySection) {
                gallerySection.scrollTop = 0;
            }
        }
        
        // Toggle Expandable Text under name
        function toggleExpandableText() {
            if (expandableTextWrapper) {
                expandableTextWrapper.classList.toggle('is-expanded');
            }
        }
        
        // Toggle Imprint Content (at bottom of Landing Page)
        function toggleImprint() {
            if (imprintContentInline) {
                imprintContentInline.classList.toggle('is-expanded');
            }
        }
        
        // --- INITIALIZATION ---
        function initialize() {
            // Get all DOM elements
            nameLinkContainer = document.getElementById('name-link-container');
            expandableTextWrapper = document.getElementById('expandable-text-wrapper');
            previewImageNav = document.getElementById('preview-image-nav');
            
            // GALERIE MODAL Elemente
            showModal = document.getElementById('show-modal');
            closeModalButton = document.getElementById('close-modal');
            modalTitle = document.getElementById('modal-title');
            modalDate = document.getElementById('modal-date');
            modalLocation = document.getElementById('modal-location');
            modalGalleryContent = document.getElementById('modal-gallery-content');
            modalText = document.getElementById('modal-text');
            
            // Imprint Elements (at bottom)
            imprintLinkBottom = document.getElementById('imprint-link-bottom');
            imprintContentInline = document.getElementById('imprint-content-inline');
            
            // --- EVENT LISTENERS ---
            // 1. Expandable Text Toggle (under name)
            if (nameLinkContainer && expandableTextWrapper) {
                nameLinkContainer.addEventListener('click', (event) => {
                    event.preventDefault();
                    toggleExpandableText();
                });
            }
            
            // 2. Imprint Toggle (at bottom)
            if (imprintLinkBottom) {
                imprintLinkBottom.addEventListener('click', (event) => {
                    event.preventDefault();
                    toggleImprint();
                });
            }
            
            // 3. Close Button für das Galerie-Modal
            if (closeModalButton) {
                closeModalButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    closeAllModals();
                });
            }
            
            // Fill expandable text content
            const expandableTextContentEl = document.getElementById('expandable-text-content');
            if (expandableTextContentEl) {
                expandableTextContentEl.innerHTML = `<p>${expandableTextContent}</p>`;
            }
            
            // Render preview images
            renderPreviewImages();
            
            // Imprint Content Element füllen
            const imprintData = seriesData.imprint;
            if (imprintData && imprintContentInline) {
                const cleanText = imprintData.description.replace(/\s+/g, ' ').trim();
                imprintContentInline.innerHTML = `<p>${cleanText}</p>`;
            }
        }
        
        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            // DOM is already ready
            initialize();
        }
    </script>
</body>
